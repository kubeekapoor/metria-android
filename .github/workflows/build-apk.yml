name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
  GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del núcleo
        run: npm test

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Empaquetar web y sincronizar
        run: |
          npm run build:web
          npx cap sync android

      - name: Permisos del wrapper
        run: chmod +x android/gradlew

      - name: APK de depuración
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: metria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar firma release
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/metria-release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/metria-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: APK release firmado
        if: env.HAS_KEYSTORE == 'true'
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Subir APK release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: metria-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar en el release del tag
        if: env.HAS_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

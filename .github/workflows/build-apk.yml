name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permiso mínimo por defecto. Solo el job de publicación pide escritura.
permissions:
  contents: read

env:
  GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del núcleo
        run: npm test

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Se declara explícitamente para no depender del valor por defecto.
          packages: platform-tools

      - name: Instalar platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Empaquetar web y sincronizar
        run: |
          npm run build:web
          npx cap sync android

      - name: Permisos del wrapper
        run: chmod +x android/gradlew

      - name: APK de depuración
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK de depuración
        uses: actions/upload-artifact@v7
        with:
          name: metria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar firma release
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/metria-release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/metria-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: APK release firmado
        if: env.HAS_KEYSTORE == 'true'
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Limpiar credenciales
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/metria-release.jks"

      - name: Subir APK release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: metria-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Comprobar si hay llave configurada
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Sin ANDROID_KEYSTORE_BASE64: no se publica release automático." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Descargar APK release
        if: steps.check.outputs.signed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: metria-release-apk
          path: dist-apk

      - name: Publicar en el release del tag
        if: steps.check.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist-apk/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
